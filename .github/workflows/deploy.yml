name: Deploy encrypted family course

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble encrypted site only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html course.enc.json sw.js manifest.webmanifest icon.svg robots.txt .nojekyll kid-layout-v54.css site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
