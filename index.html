<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f9ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小小探索家">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<title>小小探索家 V5.4 · 自适应游戏布局</title>
<style>
:root{color-scheme:light; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif;color:#173c3b;background:#f4f7f4}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px}
.panel{width:min(100%,440px);border:1px solid #dfe8e2;background:white;box-shadow:0 16px 55px #234b4217;border-radius:25px;padding:34px 30px 26px}
.logo{width:60px;height:60px;background:#174d4d;color:#f9e7be;border-radius:20px;display:grid;place-items:center;font-size:29px;margin-bottom:23px}
h1{font-size:28px;line-height:1.2;margin:0 0 13px}p{font-size:14px;line-height:1.8;color:#627875;margin:0 0 22px}
label{display:block;color:#294e4a;font-size:13px;font-weight:700;margin-bottom:9px}
input{border:1px solid #cbdad2;border-radius:13px;padding:15px 14px;font-size:16px;width:100%;outline-offset:3px}
button{width:100%;background:#174d4d;color:white;border:0;border-radius:13px;padding:15px 20px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}
button[disabled]{opacity:.55;cursor:wait}.status{font-size:13px;line-height:1.7;color:#627875;min-height:25px;margin-top:16px}
.foot{font-size:12px;line-height:1.8;color:#718783;border-top:1px solid #e4ebe6;padding-top:15px;margin-top:14px}
@media(max-width:480px){.panel{padding:26px 20px}h1{font-size:25px}}
</style>
</head>
<body>
<main class="panel">
<div class="logo" aria-hidden="true">📚</div>
<h1>小小探索家 · 家庭入口</h1>
<p>教材文件以加密形式储存。请输入家庭访问密码，解锁后可使用完整教案、学习打卡和日历导出。密码不会上传到服务器。</p>
<form id="unlock-form" autocomplete="off">
<label for="password">家庭访问密码</label>
<input id="password" type="password" required minlength="16" autocapitalize="off" spellcheck="false" autocomplete="off" placeholder="请输入家庭密码">
<button type="submit" id="unlock">解锁教材</button>
</form>
<div class="status" id="status" role="status" aria-live="polite">首次打开需要网络下载加密教材；离线缓存完成后可断网使用。</div>
<div class="foot">本站的登录页面和加密数据文件是公开可下载的，但教材明文不会直接发布。此方式不是 GitHub Pages 的真正私有访问控制；请保护好密码。</div>
</main>
<script>
(()=>{'use strict';
 const form=document.getElementById('unlock-form');
 const field=document.getElementById('password');
 const button=document.getElementById('unlock');
 const status=document.getElementById('status');
 function b64bytes(s){const a=atob(s),b=new Uint8Array(a.length);for(let i=0;i<a.length;i++)b[i]=a.charCodeAt(i);return b;}
 function setStatus(s){status.textContent=s;}
 if(!globalThis.crypto?.subtle){setStatus('当前环境不支持安全解密。请通过 HTTPS 网站使用最新版 Safari、Chrome 或 Edge。');button.disabled=true;return;}
 form.addEventListener('submit',async e=>{
   e.preventDefault();button.disabled=true;setStatus('正在安全解锁，请稍候…');
   const password=field.value;field.value='';
   try {
     const res=await fetch('./course.enc.json',{cache:'no-store'});
     if(!res.ok)throw Error('下载失败（'+res.status+'）');
     const data=await res.json();
     if(data.version!==2||data.compression!=='gzip'||data.kdf!=='PBKDF2-SHA256'||data.cipher!=='AES-256-GCM')throw Error('不支持的教材加密格式');
     const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
     const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(data.salt),iterations:data.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
     const decoded=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(data.iv),additionalData:new TextEncoder().encode(data.aad),tagLength:128},key,b64bytes(data.payload));
     if(typeof DecompressionStream==='undefined')throw Error('当前浏览器版本过旧，不支持教材解压。请升级 Safari、Chrome 或 Edge。');
     const page=await new Response(new Blob([decoded]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
     if(!page.startsWith('<!doctype html>')||!page.includes('xiaoxiao')){ /* non-fatal sanity: original app uses Chinese title */ }
     setStatus('已解锁，正在打开学习空间…');
     const patchedPage = page.replace(/<\/head>/i, '<link rel="stylesheet" href="./kid-design-v6.css"></head>');
     document.open();document.write(patchedPage);document.close();
   }catch(err){setStatus(err instanceof DOMException&&err.name==='OperationError'?'密码不正确，请重新输入。':'解锁失败：'+String(err.message||err)+'。请确认网络或缓存可用。');button.disabled=false;field.focus();}
 });
 if('serviceWorker' in navigator&&location.protocol==='https:'){
   addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
 }
})();
</script>
</body>
</html>
